<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Send customer report</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         margin: 0; padding: 1.5rem; background: #f4f5f7; color: #1f2430; }
  @media (prefers-color-scheme: dark) {
    body { background: #14161c; color: #e4e7ee; }
    .card { background: #1d2029 !important; border-color: #2c3040 !important; }
    input, select { background: #14161c; color: #e4e7ee; border-color: #2c3040 !important; }
    .chip { background: #2c3040 !important; }
  }
  h1 { font-size: 1.25rem; margin: 0 0 1rem; }
  .card { background: #fff; border: 1px solid #dde1e8; border-radius: 8px;
          padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .card h2 { font-size: 0.95rem; margin: 0 0 0.75rem; }
  label { display: block; font-size: 0.8rem; font-weight: 600; margin: 0.6rem 0 0.2rem; }
  input, select { width: 100%; box-sizing: border-box; padding: 0.45rem 0.6rem;
                  border: 1px solid #c8cdd8; border-radius: 6px; font-size: 0.9rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; min-height: 1.6rem; }
  .chip { background: #e8ebf1; border-radius: 999px; padding: 0.15rem 0.7rem;
          font-size: 0.8rem; }
  .muted { color: #7a8194; font-size: 0.8rem; }
  .error { color: #c0392b; font-size: 0.85rem; white-space: pre-wrap; }
  .ok { color: #1e8e4e; font-size: 0.85rem; }
  .warn { background: #fff4d6; border: 1px solid #e5c66a; color: #7a5c00;
          border-radius: 6px; padding: 0.5rem 0.75rem; font-size: 0.85rem;
          margin-bottom: 1rem; }
  button { padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid #c8cdd8;
           background: #fff; cursor: pointer; font-size: 0.9rem; }
  button.primary { background: #2f5cff; border-color: #2f5cff; color: #fff; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .row { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.75rem; }
  iframe { width: 100%; height: 320px; border: 1px solid #dde1e8;
           border-radius: 6px; background: #fff; }
</style>
</head>
<body>
<h1>Send customer report – <span id="caseTitle">…</span></h1>
<div id="testWarn" class="warn" hidden>
  Test mode is active: mail will be sent exclusively to the test
  recipients, not to the production customer addresses.
</div>
<div id="globalError" class="error"></div>

<div class="card">
  <h2>Recipients (determined server-side, not editable)</h2>
  <label>To (from customer attribute)</label>
  <div class="chips" id="toChips"></div>
  <div class="error" id="toError"></div>
  <label>CC (module configuration)</label>
  <div class="chips" id="ccChips"></div>
  <label>BCC (module configuration)</label>
  <div class="chips" id="bccChips"></div>
  <div class="muted" id="testInfo"></div>
</div>

<div class="card">
  <h2>Content</h2>
  <label for="subject">Subject (editable)</label>
  <input id="subject" type="text" autocomplete="off">
  <label for="mailTemplate">HTML mail template</label>
  <select id="mailTemplate"></select>
  <label for="reportTemplate">Investigation report template</label>
  <select id="reportTemplate"></select>
  <label for="reportFormat">Report format</label>
  <select id="reportFormat"></select>
</div>

<div class="card">
  <h2>Preview (mandatory before sending)</h2>
  <div class="row">
    <button id="btnPreviewMail">Show mail preview</button>
    <button id="btnPreviewReport">Show report preview</button>
  </div>
  <div class="muted" id="previewStatus">No preview generated yet.</div>
  <label>Rendered mail body</label>
  <iframe id="mailPreview" sandbox=""></iframe>
</div>

<div class="row">
  <button id="btnTestSend" hidden>Test send to test recipients</button>
  <button id="btnSend" class="primary" disabled>Send</button>
</div>
<div id="sendResult"></div>

<script>
(function () {
  "use strict";
  const qs = new URLSearchParams(location.search);
  const cid = parseInt(qs.get("cid") || "0", 10);
  const api = (p) => "/customer_case_mailer/api/" + p;
  let state = null;
  let mailPreviewed = false;
  let reportPreviewed = false;

  const el = (id) => document.getElementById(id);
  const chips = (target, list) => {
    target.innerHTML = "";
    (list && list.length ? list : []).forEach((a) => {
      const c = document.createElement("span");
      c.className = "chip"; c.textContent = a; target.appendChild(c);
    });
    if (!list || !list.length) {
      const m = document.createElement("span");
      m.className = "muted"; m.textContent = "–"; target.appendChild(m);
    }
  };

  function selection(testSend) {
    return {
      cid: cid,
      subject: el("subject").value,
      mail_template: el("mailTemplate").value,
      report_template: el("reportTemplate").value,
      report_format: el("reportFormat").value,
      test_send: !!testSend,
    };
  }

  function invalidatePreviews() {
    mailPreviewed = false; reportPreviewed = false;
    el("previewStatus").textContent =
      "Selection changed – please regenerate the mail and report preview.";
    updateSendButton();
  }

  function updateSendButton() {
    const valid = state && state.recipients_valid &&
      el("subject").value.trim().length > 0 &&
      el("mailTemplate").value && el("reportTemplate").value &&
      el("reportFormat").value && mailPreviewed && reportPreviewed;
    el("btnSend").disabled = !valid;
    el("btnTestSend").disabled = !valid;
  }

  async function postJson(path, body) {
    const resp = await fetch(api(path), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify(body),
    });
    return resp;
  }

  async function loadState() {
    try {
      const resp = await fetch(api("state?cid=" + cid), { credentials: "same-origin" });
      const data = await resp.json();
      if (!data.success) { el("globalError").textContent = data.message; return; }
      state = data.state;
      el("caseTitle").textContent =
        (state.case_name || ("Case #" + cid)) +
        (state.customer ? " (" + state.customer + ")" : "");
      el("testWarn").hidden = !state.test_mode_enabled;
      chips(el("toChips"), state.to);
      chips(el("ccChips"), state.cc);
      chips(el("bccChips"), state.bcc);
      el("toError").textContent = state.recipient_error || "";
      if (state.test_mode_enabled) {
        el("testInfo").textContent =
          "Effective recipients in test mode: " + (state.test_mode_recipients || []).join(", ");
      }
      el("subject").value = state.default_subject || "";
      if (state.subject_error) el("globalError").textContent = state.subject_error;

      fillSelect(el("mailTemplate"), state.mail_templates.map((t) => [t, t]),
                 state.default_mail_template);
      fillSelect(el("reportTemplate"),
                 state.report_templates.map((t) => [String(t.id), t.name + " (" + t.format + ")"]),
                 state.default_report_template);
      fillSelect(el("reportFormat"), state.report_formats.map((f) => [f, f.toUpperCase()]),
                 state.default_report_format);
      el("btnTestSend").hidden = !(state.test_send_available && !state.test_mode_enabled);
      updateSendButton();
    } catch (e) {
      el("globalError").textContent = "The dialog could not be loaded: " + e;
    }
  }

  function fillSelect(select, pairs, preferred) {
    select.innerHTML = "";
    pairs.forEach(([value, label]) => {
      const o = document.createElement("option");
      o.value = value; o.textContent = label; select.appendChild(o);
    });
    if (preferred) {
      const match = Array.from(select.options).find(
        (o) => o.value === String(preferred) || o.textContent.startsWith(preferred));
      if (match) select.value = match.value;
    }
  }

  el("btnPreviewMail").addEventListener("click", async () => {
    el("globalError").textContent = "";
    const resp = await postJson("preview_mail", selection(false));
    const data = await resp.json();
    if (!data.success) { el("globalError").textContent = data.message; return; }
    el("mailPreview").srcdoc = data.body_html;
    el("subject").value = el("subject").value.trim() ? el("subject").value : data.subject;
    mailPreviewed = true;
    el("previewStatus").textContent = reportPreviewed
      ? "Mail and report preview generated." : "Mail preview generated – report preview still missing.";
    updateSendButton();
  });

  el("btnPreviewReport").addEventListener("click", async () => {
    el("globalError").textContent = "";
    const resp = await postJson("preview_report", selection(false));
    if (!resp.ok) {
      const data = await resp.json().catch(() => ({ message: "Report preview failed." }));
      el("globalError").textContent = data.message;
      return;
    }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    window.open(url, "_blank"); // HTML: inline; DOCX: download by the browser
    reportPreviewed = true;
    el("previewStatus").textContent = mailPreviewed
      ? "Mail and report preview generated." : "Report preview generated – mail preview still missing.";
    updateSendButton();
  });

  async function doSend(testSend) {
    el("btnSend").disabled = true; el("btnTestSend").disabled = true;
    el("sendResult").innerHTML = "";
    const resp = await postJson("send", selection(testSend));
    const data = await resp.json();
    const div = document.createElement("div");
    div.className = data.success ? "ok" : "error";
    div.textContent = data.message + (data.note_title ? " | Note: " + data.note_title : "");
    el("sendResult").appendChild(div);
    updateSendButton();
  }

  el("btnSend").addEventListener("click", () => doSend(false));
  el("btnTestSend").addEventListener("click", () => doSend(true));

  ["subject", "mailTemplate", "reportTemplate", "reportFormat"].forEach((id) => {
    el(id).addEventListener("change", invalidatePreviews);
  });
  el("subject").addEventListener("input", updateSendButton);

  loadState();
}());
</script>
</body>
</html>
